[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-researcher"
version = "0.1.0"
description = "Agentic RAG research system"
requires-python = ">=3.11"
dependencies = [
    # HTTP / scraping
    "httpx",
    "beautifulsoup4",
    "python-multipart",       # required by FastAPI for form handling
    # Search retrievers
    "ddgs",                  # DuckDuckGo (replaces deprecated duckduckgo-search)
    "tavily-python",
    # LLM providers
    "anthropic",
    "openai",
    "google-genai",          # Google Gemini (replaces deprecated google-generativeai)
    # LangChain / orchestration
    "langchain-community",
    "langchain-openai",
    "langgraph",
    # Embeddings / vector
    "sentence-transformers",
    "numpy",
    "tiktoken",
    # Utilities
    "python-dotenv",
    "pydantic",
    "json-repair",
    "tqdm",
    "pandas",
    # API server
    "fastapi",
    "uvicorn[standard]",
    # Document export
    "python-docx",
    "md2pdf",
    # Testing
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
